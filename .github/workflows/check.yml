name: check

on:
  push:
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Syntax check (Host + Client halves)
        run: |
          node --check index.js
          node --check client.js
          node --check providers.mjs
      - name: Validate manifests and locale JSON
        run: |
          node -e "for (const f of ['package.json','locale/en.json','locale/zh.json']) JSON.parse(require('fs').readFileSync(f,'utf8'))"
          node -e "const p=require('./package.json'); if(!p.dsh?.bundle?.patch||!p.dsh?.client) process.exit(1)"
